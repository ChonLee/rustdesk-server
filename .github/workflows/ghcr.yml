name: Build and publish amd64 image to ghcr.io

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build amd64 and push classic image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2

      - name: Install musl + openssl build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev pkg-config perl make

      - name: Build
        run: cargo build --release --target=${{ env.TARGET }}

      - name: Stage binaries for the image
        run: |
          cp target/${{ env.TARGET }}/release/hbbs docker-classic/
          cp target/${{ env.TARGET }}/release/hbbr docker-classic/
          chmod -v a+x docker-classic/hbbs docker-classic/hbbr
          ls -la docker-classic/

      # ghcr requires a lowercase repository path; the owner here has capitals
      - name: Compute lowercase image name and tags
        id: vars
        run: |
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "GIT_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker-classic
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ env.GIT_TAG }}
            ${{ env.IMAGE }}:latest
